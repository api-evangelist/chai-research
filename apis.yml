x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    The Chat API documentation host docs.chai-research.com no longer resolves in DNS and the
    documented POST /v1/chat/completions route now returns a bodyless 404, leaving the
    Chaiverse developer console as the only live developer surface — and every path on
    console.chaiverse.com, including /openapi.json, answers HTTP 307 to /login, with the
    developer key issued only through the Chaiverse Discord bot or a HuggingFace OAuth sign-in.
  evidence:
  - url: https://console.chaiverse.com/openapi.json
    status: 307
  - url: https://api.chai-research.com/v1/chat/completions
    status: 404
  - url: https://www.chaiverse.com/.well-known/agent-card.json
    status: 404
  checked: '2026-08-09'
