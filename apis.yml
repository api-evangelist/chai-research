aid: chai-research
name: Chai Research
description: 'Chai Research Corp. (CHAI) is a Palo Alto consumer AI company building a
  character-and-story chat platform, where users create and talk to AI characters on iOS,
  Android and the web. Founded in 2021 by William Beauchamp, the company trains and serves
  its own conversational language models on an in-house GPU cluster, and runs Chaiverse —
  a developer platform where outside model builders submit HuggingFace-hosted language
  models, have them deployed to real Chai App users, and compete on a public leaderboard.
  A public Chat API (api.chai-research.com) and a chaiverse pip package were previously
  documented; both have since been withdrawn — see x-coverage.'
