generated: '2026-08-09'
method: probed
source: live HTTP + DNS probe of every Chai Research / Chaiverse host
summary: >-
  Chai Research published a public developer surface and has since withdrawn it without any
  published deprecation notice, sunset date, or migration path. The Chat API documentation
  host no longer resolves in DNS, the documented API route returns a bodyless 404 from the
  load balancer, the Chaiverse Python client has been removed from PyPI, and the Chaiverse
  GitHub repository is gone. The developer platform itself is still marketed at
  chaiverse.com, but its console gates every path behind a login. There is no status page
  and no deprecation policy.
